[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grimoire"
version = "0.1.0"
description = "A continuously improving reasoning engine that accumulates structured thinking patterns"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0",
    "neo4j>=5.0",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0",
    "datasets>=2.14.0",
    "numpy>=1.24",
    "boto3>=1.26",
    "google-cloud-storage>=2.10",
    "python-ulid>=1.0",
    "base58>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "ruff>=0.1",
    "mypy>=1.5",
    "black>=23.9",
    "isort>=5.12",
]

[tool.setuptools]
packages = ["grimoire"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers -v"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "A"]

[tool.black]
line-length = 100
target-version = ["py311"]
